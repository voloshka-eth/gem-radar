services:
  postgres:
    image: postgres:16-alpine
    container_name: gem_radar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gemradar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gem_radar}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gemradar} -d ${POSTGRES_DB:-gem_radar}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gem_radar_redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
